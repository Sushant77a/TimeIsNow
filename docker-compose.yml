name: timeisnow

services:
  api:
    build:
      context: .
      dockerfile: src/TimeIsNow.API/Dockerfile
    env_file:
      - .env
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_URLS: http://+:5099
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "3401:5099"
    restart: unless-stopped

  client:
    build:
      context: ./client
      dockerfile: Dockerfile
    depends_on:
      - api
    ports:
      - "3400:80"
    restart: unless-stopped
